[project]
name = "llmplan"
version = "0.1.0"
description = "CPU-only capacity planner for self-hosted LLM inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "pandas>=3.0",
    "numpy>=2.0",
    "ortools>=9.15",
    "matplotlib>=3.11",
]

[project.scripts]
llmplan = "llmplan.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pytest-cov>=5.0",
    "pandas-stubs>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmplan"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # docs keep hand-aligned code blocks

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PTH", "TID"]
ignore = [
    "N818",  # exception names are fixed by ARCHITECTURE.md section 7
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ortools", "ortools.*"]
ignore_missing_imports = true  # ortools.math_opt ships no py.typed marker or stubs

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow' --cov=llmplan --cov-report=term-missing --cov-fail-under=90"
markers = ["slow: long-running performance tests; excluded by default, select with -m slow"]
