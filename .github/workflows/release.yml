name: release

# On a version tag: build, smoke-test the wheel outside the checkout, publish to PyPI by
# trusted publishing (skipped with a notice until it is configured; docs/DEPLOY.md), and
# create the GitHub release with the CHANGELOG section of that version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  COLUMNS: "200"
  NO_COLOR: "1"
  TERM: "dumb"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Tag matches the package version
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Install smoke test (clean venv, pip, outside the checkout)
        run: uv run --no-project python scripts/wheel_smoke.py dist/*.whl --installer pip
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## [" version "]") == 1 { keep = 1; next }
            /^## \[/ { keep = 0 }
            keep
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Is PyPI publishing configured?
        id: pypi
        env:
          TRUSTED_PUBLISHING: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
          API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ "${TRUSTED_PUBLISHING}" = "true" ] || [ -n "${API_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::PyPI publishing is not configured (no PYPI_TRUSTED_PUBLISHING=true repository variable and no PYPI_API_TOKEN secret): skipping the upload. One-time setup: docs/DEPLOY.md, 'Publishing to PyPI'."
          fi
      - name: Keep only the distributions
        if: steps.pypi.outputs.enabled == 'true'
        run: rm -f dist/RELEASE_NOTES.md
      - name: Publish to PyPI
        if: steps.pypi.outputs.enabled == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}  # empty: trusted publishing

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz \
            --title "llmplan ${GITHUB_REF_NAME}" --notes-file dist/RELEASE_NOTES.md
