- id: l4-24gb
  vendor: nvidia
  name: NVIDIA L4 24GB
  vram_bytes: 24152899584  # 23034 MiB (datasheet: 24GB). TODO(M3): verify nvidia-smi total
  memory_bandwidth_gbps: 300  # datasheet: 300GB/s
  fp16_dense_tflops: 121  # datasheet: 242 with sparsity, "one-half lower without sparsity"
  fp8_dense_tflops: 242  # datasheet: 485 with sparsity (dense 242.5)
  nvlink: false  # datasheet: PCIe Gen4 x16 only
  source_url: https://www.nvidia.com/en-us/data-center/l4/
  as_of: 2026-09-30

# The A10G is an AWS-specific part; NVIDIA publishes no A10G datasheet and the AWS G5 page
# gives only memory size and an INT8 TOPS figure. A10 (non-G) datasheet numbers do not apply.
- id: a10g-24gb
  vendor: nvidia
  name: NVIDIA A10G 24GB
  vram_bytes: 24146608128  # 23028 MiB (AWS: 24 GB per GPU)
  memory_bandwidth_gbps: null  # TODO(M3): verify (no NVIDIA A10G datasheet)
  fp16_dense_tflops: null  # TODO(M3): verify (no NVIDIA A10G datasheet)
  fp8_dense_tflops: null  # Ampere has no FP8 Tensor Cores
  nvlink: false  # TODO(M3): verify; g5 instances are not documented with NVLink
  source_url: https://aws.amazon.com/ec2/instance-types/g5/
  as_of: 2026-09-30
