# GPU catalog (schema: llmplan.catalog.hardware.GPUSpec).
#
# vram_bytes is the nvidia-smi reported total (MiB x 1,048,576), not the marketing number.
# nvidia-smi totals are not published on NVIDIA datasheets; the MiB values below come from
# M1_DESIGN.md section 7.1. h100-sxm-80gb and a10g-24gb are pinned by acceptance tests.
#
# TFLOPS are dense (no sparsity), truncated to whole TFLOPS as in M1_DESIGN.md section 7.1.
# NVIDIA datasheets quote Hopper and L4 Tensor Core figures "with sparsity"; dense is one
# half of that (the L4 datasheet states this explicitly). A100 and L40S datasheets print
# dense figures directly. The datasheet figure is quoted next to each value.

- id: h100-sxm-80gb
  vendor: nvidia
  name: NVIDIA H100 SXM 80GB
  vram_bytes: 85520809984  # 81559 MiB (datasheet: 80GB)
  memory_bandwidth_gbps: 3350  # datasheet: 3.35TB/s
  fp16_dense_tflops: 989  # datasheet: 1,979 with sparsity (dense 989.5)
  fp8_dense_tflops: 1979  # datasheet: 3,958 with sparsity
  nvlink: true  # datasheet: NVLink 900GB/s
  source_url: https://www.nvidia.com/en-us/data-center/h100/
  as_of: 2026-09-30

- id: h200-sxm-141gb
  vendor: nvidia
  name: NVIDIA H200 SXM 141GB
  vram_bytes: 150754820096  # 143771 MiB (datasheet: 141GB). TODO(M3): verify nvidia-smi total
  memory_bandwidth_gbps: 4800  # datasheet: 4.8TB/s
  fp16_dense_tflops: 989  # datasheet: 1,979 with sparsity (dense 989.5)
  fp8_dense_tflops: 1979  # datasheet: 3,958 with sparsity
  nvlink: true  # datasheet: NVLink 900GB/s
  source_url: https://www.nvidia.com/en-us/data-center/h200/
  as_of: 2026-09-30

- id: a100-sxm-80gb
  vendor: nvidia
  name: NVIDIA A100 SXM 80GB
  vram_bytes: 85899345920  # 81920 MiB (datasheet: 80GB HBM2e). TODO(M3): verify nvidia-smi total
  memory_bandwidth_gbps: 2039  # datasheet: 2,039GB/s
  fp16_dense_tflops: 312  # datasheet: 312 dense | 624 with sparsity
  fp8_dense_tflops: null  # Ampere has no FP8 Tensor Cores
  nvlink: true  # datasheet: NVLink 600GB/s
  source_url: https://www.nvidia.com/en-us/data-center/a100/
  as_of: 2026-09-30

- id: a100-sxm-40gb
  vendor: nvidia
  name: NVIDIA A100 SXM 40GB
  vram_bytes: 42949672960  # 40960 MiB (datasheet: 40GB HBM2). TODO(M3): verify nvidia-smi total
  memory_bandwidth_gbps: 1555  # datasheet: 1,555GB/s (40GB SXM column)
  fp16_dense_tflops: 312  # datasheet: 312 dense | 624 with sparsity
  fp8_dense_tflops: null  # Ampere has no FP8 Tensor Cores
  nvlink: true  # datasheet: NVLink 600GB/s
  source_url: https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/a100/pdf/nvidia-a100-datasheet-us-nvidia-1758950-r4-web.pdf
  as_of: 2026-09-30

- id: l40s-48gb
  vendor: nvidia
  name: NVIDIA L40S 48GB
  vram_bytes: 48305799168  # 46068 MiB (datasheet: 48GB GDDR6). TODO(M3): verify nvidia-smi total
  memory_bandwidth_gbps: 864  # datasheet: 864GB/s
  fp16_dense_tflops: 362  # datasheet: 362.05 dense | 733 with sparsity
  fp8_dense_tflops: 733  # datasheet: 733 dense | 1,466 with sparsity
  nvlink: false  # datasheet: NVLink support No
  source_url: https://www.nvidia.com/en-us/data-center/l40s/
