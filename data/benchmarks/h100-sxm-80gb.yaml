# Benchmark rows (schema: llmplan.perf.benchmarks.BenchmarkRow), one file per GPU id.
#
# Source: NVIDIA NIM LLMs Benchmarking, "Performance" (page footer: "Last updated on Apr 01,
# 2026"; read 2026-09-30). Each table is headed "Concurrency | TTFT (ms) | ITL (ms) |
# Throughput(Tokens/s)". The companion Metrics page defines system throughput as "total
# output token throughput across all simultaneous requests", so Throughput is recorded as
# output_tokens_per_s. Values were copied from the page's HTML text, not from charts.
#
# - engine: nim. The page names the NIM container and version but not the inference engine
#   inside it (TensorRT-LLM or vLLM), so the container version is engine_version.
# - The page prints TTFT and ITL without naming the statistic (mean or median), so
#   ttft_ms_* and tpot_ms_* are null and the printed values are kept in each row's comment.
#   TODO(M3): verify the TTFT/ITL statistic with the source, then fill the p50 fields.
# - Rows with 20000 input tokens are not seeded: they exceed the 8192-token context of the
#   llama3 fixtures the aliases resolve to.
# - GPU: tables headed "1 x H100 80G" and "4 x H100 80G"; the page's hardware table
#   lists an NVIDIA DGX H100 with "H100 80GB HBM3(GH100)" GPUs, the SXM part.

